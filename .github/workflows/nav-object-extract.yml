name: NAV object extraction

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Repository path to NAV TXT/ZIP source"
        required: true
        default: "data/input/datascrip/datascrip.zip"
        type: string
      output:
        description: "Repository directory for extracted objects"
        required: true
        default: "reports/datascrip/item_journals"
        type: string
      objects:
        description: "Space-separated selectors, e.g. Page:43 Page:7335 Page:7336 Page:5769 Report:296 Report:297 Codeunit:81 Codeunit:82 Codeunit:5760 Codeunit:5761 Codeunit:5762 Codeunit:5763 Codeunit:98"
        required: true
        default: "Page:40 Page:392 Page:393 Page:519 Page:1327 Page:201 Page:900 Page:5900 Page:5906 Page:5768 Page:5769 Page:5770 Page:99000831 Page:99000914 Page:7324 Page:7365 Page:7319 Page:50066 Page:50076 Page:50077 Codeunit:22 Codeunit:23 Codeunit:241 Codeunit:242 Codeunit:243 Codeunit:244 Codeunit:900 Codeunit:901 Codeunit:1001 Codeunit:1012 Codeunit:1013 Codeunit:1021 Codeunit:1022 Codeunit:1023 Codeunit:1024 Codeunit:5407 Codeunit:5814 Codeunit:5815 Codeunit:5816 Codeunit:5817 Codeunit:5818 Codeunit:5819 Codeunit:5895 Codeunit:5980 Codeunit:5981 Codeunit:5982 Codeunit:5987 Codeunit:7301 Codeunit:7302 Codeunit:7303 Codeunit:7304 Codeunit:7324 Report:722 Report:900 Report:6001 Report:6004 Report:6005 Report:7315 Report:8613 Table:83 Table:210 Table:900 Table:901 Table:7311"
        type: string
  push:
    branches:
      - datascrip
    paths:
      - ".github/workflows/nav-object-extract.yml"
      - "scripts/export_nav_objects.py"
      - "scripts/export_nav_callers.py"

permissions:
  contents: write

concurrency:
  group: nav-object-extraction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate inputs
        id: inputs
        env:
          SOURCE: ${{ inputs.source || 'data/input/datascrip/datascrip.zip' }}
          OUTPUT: ${{ inputs.output || 'reports/datascrip/item_journals' }}
          OBJECTS: ${{ inputs.objects || 'Page:40 Page:392 Page:393 Page:519 Page:1327 Page:201 Page:900 Page:5900 Page:5906 Page:5768 Page:5769 Page:5770 Page:99000831 Page:99000914 Page:7324 Page:7365 Page:7319 Page:50066 Page:50076 Page:50077 Codeunit:22 Codeunit:23 Codeunit:241 Codeunit:242 Codeunit:243 Codeunit:244 Codeunit:900 Codeunit:901 Codeunit:1001 Codeunit:1012 Codeunit:1013 Codeunit:1021 Codeunit:1022 Codeunit:1023 Codeunit:1024 Codeunit:5407 Codeunit:5814 Codeunit:5815 Codeunit:5816 Codeunit:5817 Codeunit:5818 Codeunit:5819 Codeunit:5895 Codeunit:5980 Codeunit:5981 Codeunit:5982 Codeunit:5987 Codeunit:7301 Codeunit:7302 Codeunit:7303 Codeunit:7304 Codeunit:7324 Report:722 Report:900 Report:6001 Report:6004 Report:6005 Report:7315 Report:8613 Table:83 Table:210 Table:900 Table:901 Table:7311' }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          source = Path(os.environ["SOURCE"])
          output = Path(os.environ["OUTPUT"])
          objects = os.environ["OBJECTS"].split()
          if not source.is_file() or source.suffix.lower() not in {".zip", ".txt"}:
              raise SystemExit(f"Invalid source file: {source}")
          if output.is_absolute() or ".." in output.parts or not str(output).strip():
              raise SystemExit(f"Unsafe output directory: {output}")
          if not objects or any(not re.fullmatch(r"[A-Za-z]+:\d+", item) for item in objects):
              raise SystemExit("Objects must be space-separated Type:ID selectors")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"source={source.as_posix()}\n")
              f.write(f"output={output.as_posix()}\n")
              f.write(f"objects={' '.join(objects)}\n")
          PY

      - name: Extract NAV objects
        run: |
          python scripts/export_nav_objects.py \
            --input "${{ steps.inputs.outputs.source }}" \
            --output "${{ steps.inputs.outputs.output }}" \
            --objects ${{ steps.inputs.outputs.objects }}

      - name: Discover and export all Codeunit 50107 callers
        run: |
          python scripts/export_nav_callers.py \
            --input data/input/datascrip/datascrip.zip \
            --output reports/datascrip/stocktake_entrypoints_callers

      - name: Discover and export all Codeunit 90 callers
        run: |
          python scripts/export_nav_callers.py \
            --input data/input/datascrip/datascrip.zip \
            --output reports/datascrip/purchase_post_callers \
            --target-codeunit-id 90

      - name: Discover and export all Codeunit 22 callers
        run: |
          python scripts/export_nav_callers.py \
            --input data/input/datascrip/datascrip.zip \
            --output reports/datascrip/item_post_callers \
            --target-codeunit-id 22

      - name: Discover and export all Codeunit 23 callers
        run: |
          python scripts/export_nav_callers.py \
            --input data/input/datascrip/datascrip.zip \
            --output reports/datascrip/item_batch_post_callers \
            --target-codeunit-id 23

      - name: Commit extracted objects
        env:
          OUTPUT: ${{ steps.inputs.outputs.output }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT" reports/datascrip/stocktake_entrypoints_callers reports/datascrip/purchase_post_callers reports/datascrip/item_post_callers reports/datascrip/item_batch_post_callers
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Extract NAV objects from source archive"
          git push

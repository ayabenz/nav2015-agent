[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nav2015-agent"
version = "0.2.0"
description = "NAV 2015 TXT source ingestion and symbol and dependency extraction for NAV 2015 TXT objects"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nav-ai = "nav_ai.cli:main"
nav-diff = "nav_ai.semantic_diff:main"
nav-audit = "nav_ai.audit:main"
nav-depgraph = "nav_ai.depgraph:main"
nav-search = "nav_ai.search:main"\nnav-intel = "nav_ai.intelligence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
